spring:
  devtools:
    restart:
      enabled: false   # Désactivé : le restart classloader de DevTools brise le scan JPA des entités
  # Plusieurs @Scheduled (Sheets produits, Sheets commandes, notifications, outbox) : pool trop petit = synchros retardées.
  task:
    scheduling:
      pool:
        size: 8
  datasource:
    # Par défaut, on pointe vers Supabase CLI (db.port=54322 dans supabase/config.toml).
    # Vous pouvez surcharger via:
    # - DB_JDBC_URL (prioritaire), ou
    # - DB_HOST / DB_PORT / DB_NAME
    url: ${DB_JDBC_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5434}/${DB_NAME:postgres}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jpa:
    hibernate:
      ddl-auto: update # Met à jour le schéma automatiquement (ATTENTION: 'validate' en prod)
    show-sql: true # Affiche les requêtes SQL dans la console pour le débogage
    properties:
      hibernate:
        "[format_sql]": true # Formate le SQL pour qu'il soit lisible
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Configuration JWT (JSON Web Token) pour la sécurité
app:
  jwt:
    # Clé secrète pour signer les tokens (Doit être longue et complexe)
    secret: ${JWT_SECRET:change-me}
    # Durée de vie du token en millisecondes (604800000 = 7 jours)
    expiration: 604800000

  # Numéro WhatsApp du vendeur pour les commandes (Format international sans +)
  whatsapp-number: "22607065363"
  store-name: "SUCRE STORE"
  store-phone: "+226 XX XX XX XX"

  # Configuration du stockage des images
  storage:
    location: "uploads"

  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
    webhook-url: ${TELEGRAM_WEBHOOK_URL:}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}

  webpush:
    vapid-public-key: ${WEBPUSH_VAPID_PUBLIC_KEY:}
    vapid-private-key: ${WEBPUSH_VAPID_PRIVATE_KEY:}
    vapid-subject: ${WEBPUSH_VAPID_SUBJECT:}

  # Supabase Auth (admin API) — utilisé pour provisionner les comptes livreurs.
  # IMPORTANT: ne jamais exposer la service_role key au frontend.
  # Spring ne lit pas supabase/.env : en local, sourcez STORE/scripts/load-supabase-env.sh
  # ou exportez SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY + DB_PASSWORD (voir ce script).
  supabase:
    # En prod, SUPABASE_URL doit pointer vers votre projet Supabase (ex: https://<project-ref>.supabase.co)
    # ou vers votre gateway Kong publique si vous en avez une.
    # Ne pas mettre de valeur par défaut ici : sinon la prod peut tenter 127.0.0.1 et échouer "connection refused".
    url: ${SUPABASE_URL:}
    # OBLIGATOIRE si vous utilisez l'Admin API Supabase (création d'utilisateurs).
    # Doit être la valeur SERVICE_ROLE_KEY (jamais ANON_KEY).
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}

  delivery:
    # Secret HMAC pour sécuriser les webhooks (si vous utilisez un serveur relais).
    webhook-hmac-secret: ${DELIVERY_WEBHOOK_HMAC_SECRET:}
    # FCM : push sur téléphone (admin + manager + livreur). Même endpoint d'enregistrement : POST /api/delivery/devices/register
    fcm:
      enabled: ${FCM_ENABLED:false}
      service-account-path: ${FCM_SERVICE_ACCOUNT_PATH:}
      project-id: ${FCM_PROJECT_ID:}

google:
  sheets:
    application-name: "Sucre Store API"
    # Utiliser un fichier local via env (recommandé), sinon classpath.
    # Ex: export GOOGLE_SHEETS_CREDENTIALS_PATH=/var/secrets/sucre/credentials.json
    credentials-file-path: ${GOOGLE_SHEETS_CREDENTIALS_PATH:${GOOGLE_APPLICATION_CREDENTIALS:classpath:credentials.json}}
    spreadsheet-id: "" # ID par défaut retiré pour éviter la synchro démo. L'ID sera lu depuis la base de données.
    # fixedDelay : délai entre la fin d’un import et le début du suivant (évite chevauchements si l’import est long).
    sync-rate: 60000 # millisecondes (60000 = 1 minute après la fin de la synchro précédente)
    sync-initial-delay: 15000 # première synchro 15 s après démarrage (laisse le temps au contexte / DB)
    # Import produits : auto = export CSV public (sans OAuth) puis repli API ; csv / api = forcer une voie
    product-import-mode: ${GOOGLE_SHEETS_PRODUCT_IMPORT_MODE:auto}
    # csv-export-sheet-gid: (optionnel) gid de l’onglet = paramètre &gid= dans l’URL du Sheet ; sinon 1er onglet
    http-connect-timeout-ms: 15000
    http-read-timeout-ms: 120000

orders:
  sheets:
    # Synchronisation automatique des commandes vers Google Sheets
    # - activable/désactivable en DB via app_settings.google_orders_sheet_sync_enabled
    # - fixedDelay en ms (60000 = 1 minute après la fin de l’export précédent)
    sync-rate: 60000
    sync-initial-delay: 45000 # décalé par rapport à la synchro produits pour limiter la charge au démarrage

tenant:
  # Segment Host avant le premier point : code boutique DB (stores.code).
  # Ex. boutique en base "sucre" mais DNS sucrestore.domaine.tld → évite 400 "Unknown store".
  host-label-to-store-code:
    sucrestore: sucre

server:
  port: 8081
  shutdown: immediate   # Fermeture immédiate — évite le blocage par les connexions SSE longue durée
  # Behind reverse proxies, ensure Spring uses X-Forwarded-* headers (Host, Proto, Port).
  forward-headers-strategy: framework

# Logs : évite les fichiers énormes (backend.log multi-Go) et garde un historique.
logging:
  file:
    name: logs/sucre-store-api.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      total-size-cap: 500MB
      max-history: 14


